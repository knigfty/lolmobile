<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d23"><title>Settings — Garen Arena</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#29463f,#101d23 75%);color:#edf5ee;font-family:system-ui,-apple-system,sans-serif;padding:calc(24px + env(safe-area-inset-top)) 22px 36px}main{max-width:520px;margin:32px auto}.brand{font-size:12px;font-weight:800;letter-spacing:2px;color:#f7d78a}a{color:#f7d78a;text-decoration:none;display:inline-block;padding:12px 0}h1{font-size:32px;margin:22px 0 28px}section{padding:26px 22px;border:1px solid #c7ddc633;border-radius:20px;background:#182d2dc9;box-shadow:0 14px 45px #0003}label{font-size:18px;font-weight:750;display:block}.value{font-size:42px;font-weight:800;color:#ffe0a2;margin:16px 0 0;font-variant-numeric:tabular-nums}.unit{font-size:14px;color:#bbd2cb}#interval{color:#deebe5;line-height:1.6}input{width:100%;margin:24px 0 12px;accent-color:#f7d78a;cursor:pointer;height:30px}.ends{display:flex;justify-content:space-between;font-size:12px;color:#bbd2cb}button{margin-top:26px;min-height:44px;padding:10px 16px;border:1px solid #f7d78a88;border-radius:10px;background:transparent;color:#f7d78a;font:inherit;cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #f7d78a;outline-offset:5px}.note{font-size:13px;color:#bbd2cb;line-height:1.6;margin-top:24px}
</style></head><body><main><div class="brand">3D PLAYGROUND</div><a href="/">← Back to arena</a><h1>Settings</h1><section><label for="attack-speed">Attack speed</label><div class="value"><output id="speed-value" for="attack-speed">0.67</output></div><div class="unit">attacks per second</div><input id="attack-speed" type="range" min="0.67" max="2.5" step="0.01" value="0.67" aria-describedby="interval"><div class="ends"><span>0.67 · Default</span><span>2.50 · Maximum</span></div><p id="interval" aria-live="polite">One attack every 1.50 seconds</p><button id="reset" type="button">Reset to default</button></section><p class="note" id="save-status">Changes save automatically on this device and apply when you return to the arena.</p></main>
<script>
const slider=document.getElementById('attack-speed'),value=document.getElementById('speed-value'),interval=document.getElementById('interval');
try{const saved=Number(localStorage.getItem('garen.attackSpeed'));if(Number.isFinite(saved)&&saved>=.67&&saved<=2.5)slider.value=saved}catch{}
function update(save=true){const speed=Number(slider.value);value.textContent=speed.toFixed(2);slider.setAttribute('aria-valuetext',`${speed.toFixed(2)} attacks per second`);interval.textContent=`One attack every ${(speed<=.67?1.5:1/speed).toFixed(2)} seconds`;if(save)try{localStorage.setItem('garen.attackSpeed',String(speed))}catch{document.getElementById('save-status').textContent='Your browser blocked saving. Enable local storage to apply this setting in the arena.'}}
slider.addEventListener('input',()=>update());document.getElementById('reset').addEventListener('click',()=>{slider.value='.67';update()});update(false);
</script></body></html>
