      for(const t of hits)damageTarget(t);
    },name.startsWith('Attack')?ATTACK_DURATION*ATTACK_HIT_PHASE*1000:duration*450);
  }
}
function attack(){
  if(queueSpellCommand('attack'))return;
  attackIndex=1-attackIndex;
  const name=attackIndex?'Attack1':'Attack2';
  if(queueAttackCommand({type:'attack',name}))return;
  requestBaseAttack(name);
}
function spin(){
  waitingAttackName='';
  if(queueSpellCommand('spin')||queueAttackCommand('spin'))return;
  if(!mixer||now<lockUntil&&!dancing||runSpellActive())return;
  const name='Spell3_0';
  action(name,SPIN_DURATION,false);
  // Extend the window through repeats at the original asset's playback speed.
  actions[name].setEffectiveTimeScale(1).setLoop(THREE.LoopRepeat,Infinity);
  actions[name].clampWhenFinished=false;
  activeSpinName=name;spinStartedAt=inputTime();spinUntil=spinStartedAt+SPIN_DURATION;lockUntil=Infinity;
  for(let pulse=1;pulse<=SPIN_COUNT;pulse++)setTimeout(spinPulse,pulse*SPIN_DURATION*1000/SPIN_COUNT);
}
function dance(){
  waitingAttackName='';
  if(queueSpellCommand('dance')||queueAttackCommand('dance'))return;
  if(!mixer||now<lockUntil||runSpellActive()||spell1Target)return;
  dancing=true;lockUntil=Infinity;play('Dance_Base',.2,true);
}
const attackButton=document.getElementById('attack');
attackButton.addEventListener('pointerdown',e=>{
  e.preventDefault();if(attackPointerId!==null)return;
  attackPointerId=e.pointerId;attackButton.setPointerCapture(attackPointerId);beginAttack();
});
function releaseAttack(e){if(e.pointerId!==attackPointerId)return;attackPointerId=null;endAttack(e.type!=='pointerup')}
attackButton.addEventListener('pointerup',releaseAttack);
attackButton.addEventListener('pointercancel',releaseAttack);
attackButton.addEventListener('lostpointercapture',releaseAttack);
document.getElementById('skill').addEventListener('pointerdown',e=>{e.preventDefault();spin()});document.getElementById('dance').addEventListener('pointerdown',e=>{e.preventDefault();dance()});
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');let pointerId=null;function updateStick(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.32;let x=(e.clientX-cx)/max,y=(e.clientY-cy)/max;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}const newCommand=stickX===0&&stickY===0&&l>0;stickX=x;stickY=y;if(l>0)cancelActionForMovement(newCommand);stick.style.transform=`translate(calc(-50% + ${x*max}px),calc(-50% + ${y*max}px))`}
joy.addEventListener('pointerdown',e=>{e.preventDefault();pointerId=e.pointerId;joy.setPointerCapture(pointerId);updateStick(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===pointerId)updateStick(e)});function resetStick(e){if(e.pointerId!==pointerId)return;pointerId=null;stickX=stickY=0;stick.style.transform='translate(-50%,-50%)'}joy.addEventListener('pointerup',resetStick);joy.addEventListener('pointercancel',resetStick);
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();const newCommand=!e.repeat&&!keys.has(e.code);keys.add(e.code);if(moveKeys.has(e.code))cancelActionForMovement(newCommand);if(e.repeat)return;if(e.code==='Space')beginAttack();if(e.code==='KeyE')spin();if(e.code==='KeyR')dance()});addEventListener('keyup',e=>{keys.delete(e.code);if(e.code==='Space')endAttack()});addEventListener('blur',()=>{endAttack(true);attackPointerId=null;keys.clear();stickX=stickY=0;stick.style.transform='translate(-50%,-50%)'});
function start(gltf){const model=gltf.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;o.material.side=THREE.DoubleSide}});player.add(model);mixer=new THREE.AnimationMixer(model);for(const clip of gltf.animations)actions[clip.name]=mixer.clipAction(clip);mixer.addEventListener('finished',e=>{
  if(dancing&&current==='Dance_Base'&&e.action===actions.Dance_Base)play('Dance_Loop_BASE',.12);
});play('Idle1_Base',0);document.getElementById('loading').remove();animate()}
const loader=new GLTFLoader();const embedded=document.getElementById('embedded-model');if(embedded){try{const b=atob(embedded.textContent.trim()),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);loader.parse(a.buffer,'',start,fail)}catch(e){fail(e)}}else loader.load('./garen.glb',start,undefined,fail);
function fail(err){console.error(err);document.getElementById('loadText').textContent='Could not load model. Open through a local web server or use the single-file edition.';document.querySelector('#loading .spin').style.display='none'}
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);now+=dt;
  updateRunSpell();
  updateAttack();
  updateAttackCooldown();
  if(activeSpinName&&inputTime()>=spinUntil){
    actions[activeSpinName].stop();activeSpinName='';current='';lockUntil=0;
    play(movementInput().moving?'Run_Base':'Idle1_Base',0);
  }
  let {x,y,moving}=movementInput();
  const len=Math.hypot(x,y);
  if(moving)cancelActionForMovement();
  if(moving&&(now>=lockUntil||isSpinAnimation(current))){
    x/=Math.max(1,len);y/=Math.max(1,len);
    const speed=4.5*(inputTime()<runSpellUntil?1.35:1)*spell1SpeedMultiplier();
    movePlayer(x*speed*dt,y*speed*dt);
    // The model faces local +Z; screen right/down map to world +X/+Z.
    const desired=Math.atan2(x,y);
    const diff=((desired-player.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;
    if(!spell1Target)player.rotation.y+=diff*Math.min(1,dt*12);
    if(now>=lockUntil&&!spell1Target)play(runSpellActive()?'Run_Spell1':'Run_Base');
  }else if(now>=lockUntil&&!spell1Target)play('Idle1_Base');
  updateTargets();
  if(mixer){
    mixer.update(dt);
    // Mobile frame gaps must not stretch recovery or the three-second spin.
    if(activeAttackName||activeSpinName){
      const name=activeAttackName||activeSpinName;
      const started=activeAttackName?attackStartedAt:spinStartedAt;
      const elapsed=Math.max(0,inputTime()-started);
      actions[name].time=activeSpinName?elapsed%actions[name].getClip().duration:elapsed*actions[name].getEffectiveTimeScale();
      mixer.update(0);
    }
  }
  const aspect=innerWidth/innerHeight;
  const distance=aspect<.7?11.5:9.8;
  const goal=new THREE.Vector3(player.position.x,distance*.72,player.position.z+distance);
  camera.position.lerp(goal,Math.min(1,dt*3.4));
  camera.lookAt(player.position.x,1.1,player.position.z);
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
