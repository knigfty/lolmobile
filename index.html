    // Eye-level camera, slightly ahead of the face to avoid seeing inside the
    // champion's head while preserving the real animated torso, arms and sword.
    camera.position.set(player.position.x+forward.x*.12,1.65,player.position.z+forward.z*.12);
    if(spell1Target&&current==='Spell1'){
      // First-person leap is visual only: keep player collision on the ground.
      // The camera rises before the 45% hit tick and lands with a short jolt.
      const spellDuration=actions.Spell1.getClip().duration;
      const p=THREE.MathUtils.clamp((inputTime()-spell1StartedAt)/Math.max(.01,spellDuration),0,1);
      const rise=THREE.MathUtils.smoothstep(p,0,.22);
      const fall=1-THREE.MathUtils.smoothstep(p,.27,.45);
      const jumpHeight=2.25*rise*fall;
      const landing=THREE.MathUtils.clamp((p-.45)/.13,0,1);
      const impactJolt=p>=.45&&p<.58?-.14*Math.sin(landing*Math.PI)*Math.exp(-2*landing):0;
      camera.position.y+=jumpHeight+impactJolt;
    }
    // Back the eye away from any nearby live dummy along the view direction.
    // This prevents its surface crossing the near plane at collision distance.
    // Leave wall collision and player position untouched.
    for(const target of targets){
      if(target.hp<=0||!target.group.visible)continue;
      const toTarget=new THREE.Vector3(target.group.position.x-camera.position.x,0,target.group.position.z-camera.position.z);
      const forwardFlat=new THREE.Vector3(forward.x,0,forward.z).normalize();
      const ahead=toTarget.dot(forwardFlat);
      const side=toTarget.clone().addScaledVector(forwardFlat,-ahead).length();
      if(ahead>0&&ahead<1.65&&side<target.hitboxRadius+.25){
        const retreat=Math.min(.45,Math.max(0,1.65-ahead)*.45);
        camera.position.addScaledVector(forwardFlat,-retreat);
      }
    }
    camera.lookAt(camera.position.clone().add(forward));
    updateChampionPovMeshes();
    // The imported sword's blade runs along its local +Y axis, with its grip
    // at the origin. All first-person poses pivot around that grip.
    const t=inputTime(),moving=movementInput().moving;
    const bob=Math.sin(t*(moving?10:2.2))*(moving?.025:.006);
    const sway=Math.sin(t*(moving?5:1.5))*(moving?.025:.006);
    const spinning=!!activeSpinName||current==='Spell3_0';
    const judging=current==='Spell4_Base';
    const empowered=current==='Spell1';
    const attacking=!!activeAttackName;
    const runEmpowered=runSpellActive()||current==='Run_Spell1';
    const name=attacking?activeAttackName:empowered?'Spell1':judging?'Spell4_Base':spinning?(activeSpinName||'Spell3_0'):null;
    const clip=name?actions[name]:null;
    // Match the third-person combat timeline, including attack-speed settings.
    // The animation mixer can blend into idle before the attack actually ends,
    // so use attackStartedAt and ATTACK_DURATION instead of clip.time.
    const duration=attacking?ATTACK_DURATION:clip?clip.getClip().duration:1;
    const elapsed=attacking?t-attackStartedAt:judging?Math.max(0,clip?.time||0):empowered?Math.max(0,t-spell1StartedAt):0;
    const phase=THREE.MathUtils.clamp(elapsed/Math.max(.01,duration),0,1);
    const smooth=p=>p*p*(3-2*p);
    // The sword GLB was normalized with the grip at local (0,0,0).
    // Only rotate about this handle. Never translate the blade across screen.
    // Narrow portrait screens have a much smaller horizontal field of view.
    // Move the resting weapon inward and slightly farther from the camera so
    // its hilt and blade remain visible without changing the desktop pose.
    const portrait=THREE.MathUtils.clamp((.9-aspect)/.45,0,1);
    // Ease the first-person sword between idle (10°) and moving (20°).
    // Frame-rate-independent damping prevents a sudden angle jump.
    firstPersonMovementBlend=THREE.MathUtils.damp(firstPersonMovementBlend,moving?1:0,10,dt);
    const restPitch=THREE.MathUtils.degToRad(10+10*firstPersonMovementBlend);
    const restX=-Math.PI/2+restPitch;
    const restPX=.43-.23*portrait+sway;
    const restPY=-.68+.18*portrait+bob;
    const restPZ=-.60-.25*portrait;
    let px=restPX,py=restPY,pz=restPZ;
    let rx=restX,ry=0,rz=-.08;
    if(runEmpowered&&!empowered&&!attacking&&!spinning&&!judging){
      // RunSpell1: 45 degrees above horizontal, still visible in portrait.
      px=restPX;py=restPY;pz=restPZ;
      rx=-Math.PI/2+THREE.MathUtils.degToRad(45);
    }
    if(attacking){
      // The grip remains anchored near the body throughout the full swing.
      // Start above the right shoulder (Attack1) or left shoulder (Attack2).
      // The complete top-to-bottom strike ends at the 17.55% damage tick.
      // Then rotate continuously back to the current idle/moving pose.
      const side=name==='Attack2'?-1:1;
      const strike=smooth(THREE.MathUtils.clamp(phase/ATTACK_HIT_PHASE,0,1));
      // Finish recovery before the action ends, leaving a settled resting pose.
      const recovery=smooth(THREE.MathUtils.clamp((phase-ATTACK_HIT_PHASE)/(.84-ATTACK_HIT_PHASE),0,1));
      const topX=-Math.PI/2+THREE.MathUtils.degToRad(78);
      const bottomX=-Math.PI/2-THREE.MathUtils.degToRad(40);
      // Prioritize a tall overhead wind-up and a steep downward cut.
      // Keep the left/right diagonal distinct, but avoid a mostly sideways
      // sweep. The enlarged blade stays readable on portrait displays.
      const topArc=THREE.MathUtils.lerp(.82,.53,portrait);
      const rightArc=THREE.MathUtils.lerp(.72,.40,portrait);
      const bottomArc=THREE.MathUtils.lerp(.86,.62,portrait);
      const topZ=-.08-side*(side===1?rightArc:topArc);
      // Attack2 (top-left): preserve the overhead starting pose, but cut
      // steeply down the screen instead of sweeping too far to the right.
      // Attack1 (top-right) retains its existing trajectory.
      const bottomZ=-.08+side*(side===-1?bottomArc*.62:bottomArc);
      const topY=side*THREE.MathUtils.lerp(.29,.19,portrait);
      const bottomY=-side*(side===-1?THREE.MathUtils.lerp(.17,.11,portrait):THREE.MathUtils.lerp(.31,.21,portrait));
      const strikeX=THREE.MathUtils.lerp(topX,bottomX,strike);
      const strikeY=THREE.MathUtils.lerp(topY,bottomY,strike);
      const strikeZ=THREE.MathUtils.lerp(topZ,bottomZ,strike);
      // Keep the grip at its natural idle/walking screen position. Only
      // move forward during the strike, then ease back as the sword recovers.
      // This prevents a positional snap when the attack animation ends.
      px=restPX;
      // A downward body-weight follow-through gives the top-left strike a
      // longer vertical path. Ease the grip back during recovery so it
      // reconnects exactly with idle/walking without snapping.
      py=restPY-(side===-1?.38*strike*(1-recovery):0);
      pz=restPZ-.12*(1-recovery);
      rx=THREE.MathUtils.lerp(strikeX,restX,recovery);
      ry=THREE.MathUtils.lerp(strikeY,0,recovery);
      rz=THREE.MathUtils.lerp(strikeZ,-.08,recovery);
    }
    if(empowered){
      // Spell1 uses the same clip duration and 45% impact as third person:
      // raise the sword beyond the top of the view during the leap, then
      // bring the blade straight down into the ground just right of centre.
      const lift=smooth(THREE.MathUtils.clamp(phase/.24,0,1));
      const plunge=smooth(THREE.MathUtils.clamp((phase-.29)/(.45-.29),0,1));
      const settle=smooth(THREE.MathUtils.clamp((phase-.55)/(.96-.55),0,1));
      const raisedX=-Math.PI/2+THREE.MathUtils.degToRad(105);
      const groundedX=-Math.PI/2-THREE.MathUtils.degToRad(82);
      const preX=THREE.MathUtils.lerp(restX,raisedX,lift);
      rx=THREE.MathUtils.lerp(preX,groundedX,plunge);
      rx=THREE.MathUtils.lerp(rx,restX,settle);
      // Hilt lifts above the camera, then drops hard toward the floor.
      const liftY=1.42*lift*(1-plunge);
      const dropY=-1.13*plunge*(1-settle);
      px=THREE.MathUtils.lerp(restPX,.14,plunge);
      px=THREE.MathUtils.lerp(px,restPX,settle);
      py=restPY+liftY+dropY;
      pz=restPZ-.22*(1-settle);
      ry=0;
      rz=THREE.MathUtils.lerp(-.08,.09,plunge)*(1-settle)-.08*settle;
    }
    if(spinning){
      // Keep the blade's length exactly horizontal throughout the sweep.
      // Rotate around camera-up at the fixed grip, with a quarter-turn about
      // the blade's own axis to present its cutting edge into the sweep.
      // The camera itself never rotates.
      const turns=Math.max(0,t-spinStartedAt)*SPIN_COUNT/SPIN_DURATION;
      px=.25+sway;py=-.28+bob;pz=-.60;
      rx=-Math.PI/2;
      ry=turns*Math.PI*2;
      rz=0;
    }
    if(judging){
      // Center the grip, aim tip down, then thrust into the ground.
      const p=smooth(phase);
      px=0;py=-.08-1.15*p;pz=-.98;
      rx=Math.PI-.08;ry=0;rz=0;
    }
    firstPersonSword.position.set(px,py,pz);
    firstPersonSword.rotation.set(rx,ry,rz,'YXZ');
    if(spinning){
      // Local +Y is the blade axis: axial roll changes edge orientation,
      // without tilting the blade up/down or moving the grip pivot.
      firstPersonSword.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),Math.PI/2));
    }
    // Never display the champion mesh in first person, even while attacking.
    player.visible=false;
  }else{
    updateChampionPovMeshes();
    player.visible=true;
    // Orbit on a fixed-radius sphere: vertical dragging changes elevation, never zoom.
    // Only wheel scrolling or a two-finger pinch changes cameraZoom.
    const elevation=THREE.MathUtils.clamp(Math.atan(.72)-cameraPitch,.03,Math.PI/3);
    const radius=cameraDistance;
    const orbit=new THREE.Vector3(Math.sin(cameraYaw)*radius*Math.cos(elevation),radius*Math.sin(elevation),Math.cos(cameraYaw)*radius*Math.cos(elevation));
    const goal=player.position.clone().add(orbit);
    camera.position.lerp(goal,Math.min(1,dt*3.4));
    camera.lookAt(player.position.x,1.1,player.position.z);
  }
  // Keep the shadow frustum around the player across the larger courtyard.
  sun.position.set(player.position.x-24,48,player.position.z+20);
  sun.target.position.set(player.position.x,0,player.position.z);
  // Fade only architecture between camera and champion; collision stays solid.
  occlusionCheck-=dt;
  if(occlusionCheck<=0){
    occlusionCheck=.1;cameraFocus.set(player.position.x,1.1,player.position.z);
    const distance=camera.position.distanceTo(cameraFocus);
    cameraRay.set(camera.position,cameraFocus.sub(camera.position).normalize());cameraRay.far=distance-.5;
    for(const group of occlusionGroups.values())group.hidden=false;
    for(const hit of cameraRay.intersectObjects(cameraOccluders,false))occlusionGroups.get(hit.object.userData.occlusionGroup).hidden=true;
  }
  // In first person, fade wall geometry that reaches the eye position rather
  // than allowing the near plane to slice through a solid wall.
  for(const group of occlusionGroups.values())for(const object of group.meshes){
    const nearEye=cameraPov==='first'&&object.visible&&new THREE.Box3().setFromObject(object).distanceToPoint(camera.position)<.28;
    const material=object.material,target=nearEye ? .08 : group.hidden ? .22 : 1;
    material.opacity=THREE.MathUtils.lerp(material.opacity,target,Math.min(1,dt*9));
    const transparent=material.opacity<.995;
    if(material.transparent!==transparent){material.transparent=transparent;material.needsUpdate=true}
    material.depthWrite=!transparent;
  }
  // Cut away the hall roof when inside so the playable interior stays visible.
  const insideHall=Math.hypot(player.position.x,player.position.z+22)<10.5;
  for(const object of cameraOccluders)if(object.userData.occlusionGroup==='HallRoof')object.visible=!insideHall;
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
</script></body></html>
